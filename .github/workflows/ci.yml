name: Tests

# Every pull request and every branch push runs the tests. main is tested by
# deploy-pages.yml, which calls this workflow and deploys only if it passes.
on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  unit:
    name: npm test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # roster.test.js validates against shared-core/schema.
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Every client/**/__tests__/*.test.js, including the Full Court
      # determinism, golden-replay and 300-game fuzz tests.
      - run: npm test

  touch:
    name: Full Court on a phone (touch only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright (Python) and Chromium
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium

      # No backend: roster and assets are static, and any /api call fails and
      # falls back, which is what a phone on bad signal sees too.
      - name: Play a whole game by touch
        run: |
          npx vite --port 5184 --strictPort > vite.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:5184/BballTactics/ > /dev/null && break; sleep 1; done
          python e2e/full-court-touch.py --url http://localhost:5184/BballTactics/ --out e2e-shots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-court-touch
          path: |
            e2e-shots/
            vite.log
          if-no-files-found: ignore
