name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # Launcher changes still deploy: the release feed's format (chunking,
    # layout) lives in launcher/, and an unchanged game republishes the same
    # content-addressed chunks.
    paths-ignore: ['.github/workflows/launcher.yml', 'docs/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The same tests every pull request runs (ci.yml); nothing deploys unless
  # they pass.
  tests:
    uses: ./.github/workflows/ci.yml
    with:
      e2e: false

  deploy:
    needs: tests
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build client
        env:
          # Repoint via repo variable (Settings → Secrets and variables →
          # Actions → Variables → VITE_API_BASE) without editing this file.
          VITE_API_BASE: ${{ vars.VITE_API_BASE || 'https://www.brooksroley.com' }}
        run: npx vite build

      # The desktop launcher's update feed, published beside the web game at
      # /BballTactics/launcher-feed/hardwood/channel.json: the game built for
      # the launcher (offline), chunked and content-addressed (launcher/README.md).
      - name: Build the launcher release feed
        working-directory: launcher
        run: |
          npm ci
          npm run stage-game
          npm run make-release -- --payload payload/hardwood --out ../dist/launcher-feed

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
