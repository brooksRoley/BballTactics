name: Launcher CI

# The launcher installs the game, so a change to either can break the other:
# run on launcher changes and on the game sources the payload is built from.
on:
  push:
    branches: [main]
    paths: ['launcher/**', 'client/**', 'public/**', 'index.html', 'vite.config.js', 'package-lock.json', '.github/workflows/launcher.yml']
  pull_request:
    paths: ['launcher/**', 'client/**', 'public/**', 'index.html', 'vite.config.js', 'package-lock.json', '.github/workflows/launcher.yml']

defaults:
  run:
    working-directory: launcher

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            launcher/package-lock.json
      # The game's own dependencies, for staging its build into launcher/payload.
      - run: npm ci
        working-directory: .
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run stage-game
      - run: npm run build
      # In a fresh profile: check the launcher window, install Hardwood with
      # every file verified, play it, check the engine runs. Exits 0 or 1.
      - run: mkdir -p smoke-shots && LAUNCHER_SMOKE_SHOTS=$PWD/smoke-shots npm run smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshots
          path: launcher/smoke-shots/
          if-no-files-found: ignore
